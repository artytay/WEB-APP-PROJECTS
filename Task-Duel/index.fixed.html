<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚔️ Task-Duel Masterblock (fixed)</title>
    <style>
        /* Minimal: reuse the same CSS as original to keep layout identical */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --primary: #6366f1; --primary-dark:#4f46e5; --secondary:#8b5cf6; --success:#10b981; --danger:#ef4444; --warning:#f59e0b; --dark:#1f2937; --darker:#111827; --light:#f9fafb; --gray:#6b7280; --border:#e5e7eb; --shadow:rgba(0,0,0,0.1); }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height:100vh; padding:20px; }
        .container{ max-width:1400px; margin:0 auto; background:white; border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,0.3); overflow:hidden; }
        .header{ background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); color:white; padding:30px; text-align:center; }
        .header h1{ font-size:2.5em; margin-bottom:10px; display:flex; align-items:center; justify-content:center; gap:15px; }
        .header p{ opacity:0.9; font-size:1.1em; }
        /* Other CSS omitted for brevity - uses same styles as original file */
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><span>⚔️</span><span>Task-Duel Masterblock</span></h1>
            <p>Make better decisions through pairwise comparison and Elo ranking</p>
        </div>
        <div class="nav-tabs" id="navTabs">
            <button class="nav-tab active" data-tab="dashboard">📊 Dashboard</button>
            <button class="nav-tab" data-tab="duel">⚔️ Duel Arena</button>
            <button class="nav-tab" data-tab="results">🏆 Results</button>
            <button class="nav-tab" data-tab="history">📜 History</button>
            <button class="nav-tab" data-tab="memory">💾 Memory</button>
            <button class="nav-tab" data-tab="integrations">🔗 Integrations</button>
            <button class="nav-tab" data-tab="settings">⚙️ Settings</button>
        </div>
        <div id="dashboard" class="tab-content active">
            <h2>🎯 Quick Start Presets</h2>
            <div id="presetGrid"></div>
            <button onclick="createCustomSession()">Create Custom Session</button>
        </div>
        <div id="duel" class="tab-content">
            <div id="comparisonArea"><div class="empty-state"><h3>Ready to Start</h3></div></div>
        </div>
    </div>

<script>
    // Minimal JS to demonstrate corrected functions; full logic mirrors index.html but cleaned
    let appState = { sessions: [], currentSession: null, items: [], comparisons: [], currentPair: null, settings: { keyboardShortcuts: true, autoSave: true, defaultElo: 1500, kFactor: 32 }, notion: { connected:false, token:'', databaseId:'' } };

    const presets = [];

    window.addEventListener('DOMContentLoaded', () => {
        // loadFromStorage(); renderPresets(); updateDashboardStats(); loadSettings(); setupKeyboardShortcuts();
        document.querySelectorAll('.nav-tab').forEach(btn => {
            btn.addEventListener('click', () => switchTab(btn.dataset.tab, btn));
        });
        switchTab('dashboard');
    });

    function switchTab(tabName, clickedEl){
        document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
        if(clickedEl) clickedEl.classList.add('active');
        document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
        const target = document.getElementById(tabName);
        if(target) target.classList.add('active');
    }

    function createCustomSession() {
        const itemsInput = prompt(
`Enter items to compare (one per line):

Example:
Finish project
Exercise
Read book`
        );

        if (!itemsInput) return;

        const items = itemsInput
            .split('\n')
            .map(line => line.trim())
            .filter(line => line.length > 0)
            .map(name => ({ name, description: '', elo: appState.settings.defaultElo, wins:0, losses:0, comparisons:0 }));

        if (items.length < 2) { alert('Please enter at least 2 items to compare'); return; }

        appState.items = items;
        appState.currentSession = { id: Date.now(), presetId:'custom', title: 'Custom Session', startTime: new Date().toISOString(), items:[...appState.items], comparisons:[] };

        // generateComparisons(); switchTab('duel'); nextComparison();
        alert('Custom session created with ' + items.length + ' items (demo).');
    }
</script>
</body>
</html>
